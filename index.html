<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Faltas da Vivi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="logofadi.jpg">
</head>
<body>
    <div class="container">
        <h1>Tabela de Faltas da Vivi</h1>
        <div class="table-responsive">
            <table id="faltas-table">
                <thead>
                    <tr>
                        <th>Matéria</th>
                        <th>Faltas</th>
                        <th>Limite de Faltas</th>
                        <th>Faltas Restantes</th>
                        <th>% de Faltas</th>
                        <th>% de Presença</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- As linhas serão preenchidas pelo JS -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
